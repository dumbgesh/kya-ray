name: Feature Request
description: Suggest an idea or enhancement for Kya-Ray
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Kya-Ray better? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please explain.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like Kya-Ray to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.

